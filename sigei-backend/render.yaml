# Demonstracao do TCC: API no Render Free e PostgreSQL externo no Neon.
services:
  - type: web
    name: SIGEI
    runtime: docker
    plan: free
    region: oregon
    rootDir: sigei-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_OPTS
        value: -Xms64m -Xmx256m -XX:+UseSerialGC -Dfile.encoding=UTF-8
      - key: DATABASE_POOL_SIZE
        value: "3"
      - key: DATABASE_POOL_MIN_IDLE
        value: "0"
      - key: SERVER_TOMCAT_THREADS_MAX
        value: "20"
      - key: SERVER_TOMCAT_THREADS_MIN_SPARE
        value: "2"
      - key: SERVER_COMPRESSION_ENABLED
        value: "true"
      - key: SERVER_COMPRESSION_MIME_TYPES
        value: application/json
      - key: SERVER_COMPRESSION_MIN_RESPONSE_SIZE
        value: 1KB
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SIGEI_CHAVE_DADOS_SENSIVEIS
        sync: false
      - key: SIGEI_ADMIN_EMAIL
        sync: false
      - key: SIGEI_ADMIN_PASSWORD
        sync: false
      - key: SIGEI_COOKIE_SECURE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SIGEI_DADOS_INICIAIS_ENABLED
        value: "false"
