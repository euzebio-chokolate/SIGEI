info:
  name: Salvar Equipe Escola
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/equipes
  body:
    type: json
    data: |
      {
        "escolaId": 1,
        "registroAnualId": 1,
        "temProfessorResponsavel": true,
        "temEquipeGestora": true,
        "temMerendeira": false,
        "temZeladora": true,
        "temBarqueiro": false,
        "necessitaTransporte": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
