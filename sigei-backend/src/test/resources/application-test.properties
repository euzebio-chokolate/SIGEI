spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto = create-drop
# As migrações usam SQL do PostgreSQL; ficam cobertas por FlywayMigracoesTest (Testcontainers)
spring.flyway.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=segredo-exclusivo-para-execucao-dos-testes-automatizados
jwt.refresh-expiration=604800000
# Chave fixa só para os testes (32 bytes em Base64); em produção vem de SIGEI_CHAVE_DADOS_SENSIVEIS
sigei.dados-sensiveis.chave=c2lnZWktY2hhdmUtZGUtdGVzdGUtZGFkb3Mtc2Vuc2l2ZWlzLTMyYg==
