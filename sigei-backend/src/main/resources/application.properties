spring.application.name=sigei-backend

# Permite que execuções locais pelo IntelliJ carreguem o arquivo .env da raiz.
spring.config.import=optional:file:.env[.properties]

# Configurações de Banco de Dados
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sigei}
spring.datasource.username=${DATABASE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${DATABASE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DATABASE_POOL_MIN_IDLE:1}

# Esquema versionado pelo Flyway (src/main/resources/db/migration).
# Bancos criados antes do Flyway, sem histórico de migrações, são marcados como
# baseline na versão 1 (esquema inicial) e recebem apenas as migrações seguintes.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Configurações do Hibernate/JPA
# O Hibernate apenas confere se as entidades correspondem ao esquema migrado.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Trilha de auditoria (Hibernate Envers): tabelas <entidade>_aud e revisao.
# Exclusões guardam os últimos valores, para que o histórico mostre o que foi removido.
# Mudanças em coleções não geram revisão do lado pai; cada filho registra a sua.
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true
spring.jpa.properties.org.hibernate.envers.revision_on_collection_change=false

# Tamanho máximo permitido para arquivos
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

jwt.secret=${JWT_SECRET}
# Access token curto (15 min); a sessão é mantida pelo refresh token (7 dias)
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
# Tokens em cookies HttpOnly/SameSite=Strict. Use false apenas em acesso por HTTP sem TLS (ex.: IP da rede local).
sigei.auth.cookie-secure=${SIGEI_COOKIE_SECURE:true}
# Chave mestra dos dados sensíveis dos professores (CPF, matrícula e número do contrato),
# gravados com AES-256-GCM. Obrigatória: 32 bytes aleatórios em Base64 (openssl rand -base64 32).
# Perder ou trocar a chave torna ilegíveis os dados já gravados.
sigei.dados-sensiveis.chave=${SIGEI_CHAVE_DADOS_SENSIVEIS:}
# O Swagger UI envia o cabeçalho X-XSRF-TOKEN a partir do cookie XSRF-TOKEN
springdoc.swagger-ui.csrf.enabled=true

sigei.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Administrador criado automaticamente apenas quando o e-mail ainda não existe.
# Em produção, informe estes valores por variáveis de ambiente.
sigei.admin.name=${SIGEI_ADMIN_NAME:Administrador}
sigei.admin.email=${SIGEI_ADMIN_EMAIL:admin@sigei.com}
sigei.admin.password=${SIGEI_ADMIN_PASSWORD:}

# Carga automática das escolas: executada somente quando o banco não possui registros anuais.
sigei.dados-iniciais.enabled=${SIGEI_DADOS_INICIAIS_ENABLED:true}
sigei.dados-iniciais.infraestrutura=${SIGEI_PLANILHA_INFRAESTRUTURA:file:./planilhas/Quadro_Geral_Constru\u00e7\u00e3o_Escolas_2025_Atualizada.xlsx}
sigei.dados-iniciais.matriculas=${SIGEI_PLANILHA_MATRICULAS:file:./planilhas/Censo_Escolas_Ind\u00edgenas_2025_Ultima Vers\u00e3o_12.12.2025.xlsx}
# Quadro de professores de 2026: importado enquanto não houver professores cadastrados.
sigei.dados-iniciais.professores=${SIGEI_PLANILHA_PROFESSORES:file:./planilhas/Quadro_Escolas_Professores_Ind\u00edgenas_2026.xlsx}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
