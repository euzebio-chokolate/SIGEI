services:
  postgres:
    image: postgres:18
    container_name: sigei-postgres
    restart: always
    environment:
      POSTGRES_DB: sigei
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
