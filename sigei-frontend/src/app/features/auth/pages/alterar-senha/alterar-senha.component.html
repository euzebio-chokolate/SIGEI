<div class="min-h-screen bg-slate-100 flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-lg rounded-3xl bg-white p-7 shadow-xl sm:p-10">
    <div class="mb-8 flex items-center gap-3">
      <img src="assets/logo/Logo-SIGEI.svg" alt="Logo SIGEI" class="h-12 w-12" />
      <div>
        <h1 class="text-xl font-bold text-slate-800">Alterar senha</h1>
        <p class="mt-1 text-sm text-slate-500">{{ trocaObrigatoria ? 'Defina uma nova senha para acessar o SIGEI.' : 'Atualize sua senha de acesso.' }}</p>
      </div>
    </div>

    @if (trocaObrigatoria) {
      <div class="mb-6 rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800">
        Este acesso usa uma senha temporária. As demais áreas ficarão bloqueadas até a alteração.
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="alterarSenha()" class="space-y-5">
      <div>
        <label for="senhaAtual" class="mb-1.5 block text-xs font-semibold text-slate-700">Senha atual</label>
        <input id="senhaAtual" [type]="mostrarSenhas ? 'text' : 'password'" formControlName="senhaAtual" autocomplete="current-password" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20" />
        <app-erro-campo [controle]="form.controls.senhaAtual" [mensagens]="{ required: 'Informe a senha atual.' }" />
      </div>
      <div>
        <label for="novaSenha" class="mb-1.5 block text-xs font-semibold text-slate-700">Nova senha</label>
        <input id="novaSenha" [type]="mostrarSenhas ? 'text' : 'password'" formControlName="novaSenha" autocomplete="new-password" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20" />
        <app-erro-campo
          [controle]="form.controls.novaSenha"
          [mensagens]="{ required: 'Informe a nova senha.', minlength: 'A nova senha deve ter pelo menos 8 caracteres.', maxlength: 'A nova senha deve ter no máximo 72 caracteres.', igualAtual: 'A nova senha deve ser diferente da senha atual.' }"
        />
      </div>
      <div>
        <label for="confirmacaoSenha" class="mb-1.5 block text-xs font-semibold text-slate-700">Confirme a nova senha</label>
        <input id="confirmacaoSenha" [type]="mostrarSenhas ? 'text' : 'password'" formControlName="confirmacaoSenha" autocomplete="new-password" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20" />
        <app-erro-campo
          [controle]="form.controls.confirmacaoSenha"
          [mensagens]="{ required: 'Confirme a nova senha.', confirmacao: 'A confirmação não corresponde à nova senha.' }"
        />
      </div>

      <label class="flex cursor-pointer items-center gap-2 text-sm text-slate-600"><input type="checkbox" [checked]="mostrarSenhas" (change)="mostrarSenhas = !mostrarSenhas" class="accent-emerald-600" /> Mostrar senhas</label>
      @if (erroMensagem) { <div class="rounded-xl border border-rose-100 bg-rose-50 p-4 text-sm text-rose-600">{{ erroMensagem }}</div> }

      <button type="submit" [disabled]="carregando" class="w-full rounded-xl bg-emerald-600 py-3 text-sm font-semibold text-white transition hover:bg-emerald-700 disabled:opacity-60">
        {{ carregando ? 'Alterando...' : 'Alterar senha' }}
      </button>
      <button type="button" (click)="logout()" class="w-full py-2 text-sm font-semibold text-slate-500 hover:text-slate-700">Sair</button>
    </form>
  </div>
</div>
