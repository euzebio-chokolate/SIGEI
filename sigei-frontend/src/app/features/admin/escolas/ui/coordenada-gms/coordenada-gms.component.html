<fieldset>
  <legend class="block text-xs font-semibold text-slate-700 mb-1.5">
    {{ rotulo() }}
  </legend>

  <div class="grid grid-cols-[1fr_1fr_1.3fr_1.4fr] gap-2">
    <div class="relative">
      <input
        [id]="tipo() + 'Graus'"
        type="number"
        min="0"
        [max]="tipo() === 'latitude' ? 90 : 180"
        step="1"
        inputmode="numeric"
        [value]="gms().graus ?? ''"
        (input)="alterarNumero('graus', $event)"
        (blur)="marcarTocado()"
        placeholder="9"
        [attr.aria-label]="rotulo() + ': graus'"
        class="w-full pl-3 pr-6 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500"
      >
      <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-sm text-slate-400 pointer-events-none">°</span>
    </div>

    <div class="relative">
      <input
        type="number"
        min="0"
        max="59"
        step="1"
        inputmode="numeric"
        [value]="gms().minutos ?? ''"
        (input)="alterarNumero('minutos', $event)"
        (blur)="marcarTocado()"
        placeholder="58"
        [attr.aria-label]="rotulo() + ': minutos'"
        class="w-full pl-3 pr-6 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500"
      >
      <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-sm text-slate-400 pointer-events-none">'</span>
    </div>

    <div class="relative">
      <input
        type="text"
        inputmode="decimal"
        [value]="textoSegundos()"
        (input)="alterarNumero('segundos', $event)"
        (blur)="marcarTocado()"
        placeholder="29,03"
        [attr.aria-label]="rotulo() + ': segundos'"
        class="w-full pl-3 pr-6 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500"
      >
      <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-sm text-slate-400 pointer-events-none">"</span>
    </div>

    <select
      [value]="gms().direcao"
      (change)="alterarDirecao($event)"
      (blur)="marcarTocado()"
      [attr.aria-label]="rotulo() + ': direção'"
      class="w-full px-2 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500"
    >
      @for (opcao of direcoes(); track opcao.valor) {
        <option [value]="opcao.valor" [selected]="opcao.valor === gms().direcao">{{ opcao.rotulo }}</option>
      }
    </select>
  </div>

  @if (controle().value !== null && !erro()) {
    <p class="text-xs text-slate-400 mt-1.5">Decimal: {{ controle().value }}</p>
  }

  <app-erro-campo [controle]="controle()" [mensagens]="mensagens" />
</fieldset>
